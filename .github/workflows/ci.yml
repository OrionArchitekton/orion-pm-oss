name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build 'setuptools>=77'
      - run: python scripts/check.py
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  required-checks-fail-closed:
    if: ${{ always() }}
    needs: [conformance, gitleaks]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful tests and secret scan
        env:
          TEST_RESULT: ${{ needs.conformance.result }}
          SCAN_RESULT: ${{ needs.gitleaks.result }}
        run: test "$TEST_RESULT" = success && test "$SCAN_RESULT" = success
