name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build 'setuptools>=77'
      - run: python scripts/check.py
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  required-checks-fail-closed:
    if: ${{ always() }}
    needs: [conformance, gitleaks]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful tests and secret scan
        env:
          TEST_RESULT: ${{ needs.conformance.result }}
          SCAN_RESULT: ${{ needs.gitleaks.result }}
        run: test "$TEST_RESULT" = success && test "$SCAN_RESULT" = success
